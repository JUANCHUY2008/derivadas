<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Derivadas Directas con Argumento - Prepa</title>
    <style>
        /* Fondo Animado con gradiente en movimiento */
        @keyframes fondoAnimado {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #ff0000, #cc0000, #ff3333, #990000);
            background-size: 400% 400%;
            animation: fondoAnimado 12s ease infinite;
            color: #000000;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            background-color: rgba(255, 42, 42, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            max-width: 600px;
            width: 90%;
            border: 3px solid #000000;
        }

        /* Botones Naranjas */
        button {
            background-color: #ff6600;
            color: #000000;
            border: 3px solid #000000;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 10px;
            box-shadow: 0 4px 0 #000000;
        }

        button:hover {
            background-color: #ff8533;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #000000;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #000000;
        }

        /* Pantallas */
        .screen {
            display: none;
        }

        .active {
            display: block;
        }

        /* Pantalla de Inicio */
        #inicio h1 {
            font-size: 3.5rem;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 2px 2px 0px #fff, -2px -2px 0px #fff, 2px -2px 0px #fff, -2px 2px 0px #fff;
        }

        /* Pantalla de Calculadora */
        select, input {
            padding: 10px;
            font-size: 1.1rem;
            border: 2px solid #000000;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            background-color: #ffffff;
            color: #000000;
        }

        .opcion-bloque {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px dashed #000000;
        }

        /* Contenedor de Resultados y Procedimientos */
        #resultado-box {
            margin-top: 25px;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            border: 3px solid #000000;
            text-align: left;
            display: none;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        #resultado-box h3 {
            margin-top: 0;
            border-bottom: 2px dashed #000000;
            padding-bottom: 8px;
        }

        .paso {
            margin-bottom: 12px;
            font-size: 1.1rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div id="inicio" class="screen active">
            <h1>DERIVADA DIRECTA</h1>
            <button id="btn-comenzar">Calcular ya</button>
        </div>

        <div id="calculadora" class="screen">
            <h2>Formulario de Derivadas (Argumento Compuesto)</h2>
            <p>Selecciona la función. Ahora puedes cambiar el número interno de la <b>x</b>:</p>
            
            <div class="opcion-bloque">
                <label for="tipo-derivada"><b>Tipo: </b></label>
                <select id="tipo-derivada">
                    <option value="potencia">f(x) = axⁿ (Potencia)</option>
                    <option value="seno">f(x) = a · sin(kx) (Seno)</option>
                    <option value="coseno">f(x) = a · cos(kx) (Coseno)</option>
                    <option value="logaritmo">f(x) = a · ln(kx) (Logaritmo Natural)</option>
                </select>
            </div>

            <div id="inputs-dinamicos" class="opcion-bloque">
                <span>f(x) = </span>
                <input type="number" id="val-a" value="4" style="width: 60px;" placeholder="a">
                <span>x </span>
                <input type="number" id="val-n" value="3" style="width: 60px;" placeholder="n">
            </div>

            <button id="btn-calcular">Calcular Derivada</button>
            <button id="btn-volver" style="background-color: #cc5200;">Volver</button>

            <div id="resultado-box">
                <h3>Procedimiento paso a paso:</h3>
                <div id="pasos-derivada"></div>
            </div>
        </div>

    </div>

    <script>
        // Navegación
        const pantallaInicio = document.getElementById('inicio');
        const pantallaCalculadora = document.getElementById('calculadora');
        const btnComenzar = document.getElementById('btn-comenzar');
        const btnVolver = document.getElementById('btn-volver');
        const btnCalcular = document.getElementById('btn-calcular');
        const tipoDerivada = document.getElementById('tipo-derivada');
        const inputsDinamicos = document.getElementById('inputs-dinamicos');
        const resultadoBox = document.getElementById('resultado-box');
        const pasosDiv = document.getElementById('pasos-derivada');

        btnComenzar.addEventListener('click', () => {
            pantallaInicio.classList.remove('active');
            pantallaCalculadora.classList.add('active');
        });

        btnVolver.addEventListener('click', () => {
            pantallaCalculadora.classList.remove('active');
            pantallaInicio.classList.add('active');
            resultadoBox.style.display = 'none';
        });

        // Cambiar estructura de inputs según la fórmula
        tipoDerivada.addEventListener('change', () => {
            resultadoBox.style.display = 'none';
            const opcion = tipoDerivada.value;
            
            if (opcion === 'potencia') {
                inputsDinamicos.innerHTML = `
                    <span>f(x) = </span>
                    <input type="number" id="val-a" value="4" style="width: 60px;">
                    <span>x</span>
                    <input type="number" id="val-n" value="3" style="width: 60px;">
                `;
            } else if (opcion === 'seno' || opcion === 'coseno') {
                inputsDinamicos.innerHTML = `
                    <span>f(x) = </span>
                    <input type="number" id="val-a" value="2" style="width: 55px;" placeholder="a">
                    <span> · ${opcion}(</span>
                    <input type="number" id="val-k" value="5" style="width: 55px;" placeholder="k">
                    <span>x)</span>
                `;
            } else if (opcion === 'logaritmo') {
                inputsDinamicos.innerHTML = `
                    <span>f(x) = </span>
                    <input type="number" id="val-a" value="3" style="width: 55px;" placeholder="a">
                    <span> · ln(</span>
                    <input type="number" id="val-k" value="4" style="width: 55px;" placeholder="k">
                    <span>x)</span>
                `;
            }
        });

        // Motor de cálculo matemático
        btnCalcular.addEventListener('click', () => {
            const opcion = tipoDerivada.value;
            let htmlPasos = "";
            let resultadoFinal = "";

            const a = parseFloat(document.getElementById('val-a').value || 1);

            if (opcion === 'potencia') {
                const n = parseFloat(document.getElementById('val-n').value || 1);
                htmlPasos = `
                    <div class="paso"><b>Fórmula:</b> d/dx [a·xⁿ] = a · n · xⁿ⁻¹</div>
                    <div class="paso"><b>Paso 1:</b> Multiplicar coeficiente por exponente &rarr; ${a} × ${n} = ${a * n}</div>
                    <div class="paso"><b>Paso 2:</b> Restar 1 al exponente &rarr; ${n} - 1 = ${n - 1}</div>
                `;
                resultadoFinal = `${a * n}x<sup>${n - 1}</sup>`;

            } else if (opcion === 'seno') {
                const k = parseFloat(document.getElementById('val-k').value || 1);
                const coeficienteFinal = a * k;
                
                htmlPasos = `
                    <div class="paso"><b>Fórmula (con argumento):</b> d/dx [a · sin(kx)] = a · k · cos(kx)</div>
                    <div class="paso"><b>Paso 1 (Derivada interna):</b> La derivada de lo de adentro (<b>${k}x</b>) es <b>${k}</b>.</div>
                    <div class="paso"><b>Paso 2 (Multiplicación externa):</b> Multiplicas la constante exterior por la interna &rarr; ${a} × ${k} = ${coeficienteFinal}</div>
                    <div class="paso"><b>Paso 3:</b> Cambias el seno por el coseno manteniendo su argumento idéntico.</div>
                `;
                resultadoFinal = `${coeficienteFinal} · cos(${k}x)`;

            } else if (opcion === 'coseno') {
                const k = parseFloat(document.getElementById('val-k').value || 1);
                const coeficienteFinal = -(a * k);
                
                htmlPasos = `
                    <div class="paso"><b>Fórmula (con argumento):</b> d/dx [a · cos(kx)] = -a · k · sin(kx)</div>
                    <div class="paso"><b>Paso 1 (Derivada interna):</b> La derivada de <b>${k}x</b> es <b>${k}</b>.</div>
                    <div class="paso"><b>Paso 2 (Cambio de signo y producto):</b> Como la derivada del coseno es el <i>menos seno</i>, el resultado se vuelve negativo &rarr; -(${a} × ${k}) = ${coeficienteFinal}</div>
                `;
                resultadoFinal = `${coeficienteFinal} · sin(${k}x)`;

            } else if (opcion === 'logaritmo') {
                const k = parseFloat(document.getElementById('val-k').value || 1);
                
                htmlPasos = `
                    <div class="paso"><b>Fórmula (con argumento):</b> d/dx [a · ln(kx)] = a · (k / kx) = a / x</div>
                    <div class="paso"><b>Explicación de Prepa:</b> Por regla de la cadena, la derivada es: <b>${a} × (${k} / ${k}x)</b>.</div>
                    <div class="paso"><b>Paso de simplificación:</b> Nota que el número interno <b>${k}</b> arriba y abajo se cancelan (${k}/${k} = 1). ¡Por lo tanto, la constante interna no afecta el resultado final!</div>
                `;
                resultadoFinal = `${a}/x`;
            }

            // Renderizar resultado decorado
            htmlPasos += `
                <div class="paso" style="font-size: 1.3rem; margin-top: 15px; border-top: 2px dashed #000000; padding-top: 10px;">
                    <b>f'(x) = </b> <span style="color: #ff6600; font-weight: bold;">${resultadoFinal}</span>
                </div>
            `;

            pasosDiv.innerHTML = htmlPasos;
            resultadoBox.style.display = 'block';
        });
    </script>
</body>
</html>
