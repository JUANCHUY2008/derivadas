<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Derivadas - Entrada Única y División</title>
    <style>
        /* Fondo Animado con gradiente en movimiento */
        @keyframes fondoAnimado {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #0044ff, #0022aa, #3366ff, #001155);
            background-size: 400% 400%;
            animation: fondoAnimado 12s ease infinite;
            color: #000000;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            background-color: rgba(42, 141, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            max-width: 650px;
            width: 90%;
            border: 3px solid #000000;
        }

        /* Botones y selectores con estilo unificado */
        button, select {
            background-color: #00cc44;
            color: #000000;
            border: 3px solid #000000;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 10px;
            box-shadow: 0 4px 0 #000000;
        }

        select {
            background-color: #ffffff;
            padding: 10px 20px;
            font-size: 1.1rem;
        }

        button:hover {
            background-color: #33ff77;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #000000;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #000000;
        }

        /* Pantallas */
        .screen {
            display: none;
        }

        .active {
            display: block;
        }

        /* Pantalla de Inicio */
        #inicio h1 {
            font-size: 3.5rem;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 2px 2px 0px #fff, -2px -2px 0px #fff, 2px -2px 0px #fff, -2px 2px 0px #fff;
        }

        /* Bloque contenedor matemático */
        .opcion-bloque {
            background-color: rgba(255, 255, 255, 0.4);
            padding: 35px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 2px dashed #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .texto-matematico {
            font-size: 2.2rem;
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
        }

        /* UN SOLO CUADRO LARGO Y CONTINUO */
        .input-unico-largo {
            width: 320px;
            height: 70px;
            font-size: 1.8rem;
            border: 3px solid #000000;
            border-radius: 15px;
            text-align: center;
            font-weight: bold;
            background-color: #ffffff;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.15);
            font-family: 'Segoe UI', sans-serif;
        }

        /* CUADROS INDEPENDIENTES PARA LA FRACCIÓN */
        .input-fraccion-libre {
            width: 220px;
            height: 65px;
            font-size: 1.8rem;
            border: 3px solid #000000;
            border-radius: 15px;
            text-align: center;
            font-weight: bold;
            background-color: #ffffff;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.15);
        }

        /* Estructura Fraccionaria */
        .contenedor-fraccion {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
        }

        .fila-numerador { padding-bottom: 10px; }
        .fila-denominador { padding-top: 10px; }

        .linea-fraccion {
            width: 105%;
            height: 4px;
            background-color: #000000;
            border-radius: 2px;
        }

        /* Contenedor de Resultados */
        #resultado-box {
            margin-top: 25px;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            border: 3px solid #000000;
            text-align: left;
            display: none;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        #resultado-box h3 {
            margin-top: 0;
            border-bottom: 2px dashed #000000;
            padding-bottom: 8px;
            text-transform: uppercase;
        }

        .paso {
            margin-bottom: 14px;
            font-size: 1.15rem;
            line-height: 1.6;
        }

        /* Estilo para los botones de alternancia de vista rápida */
        .btn-vista-rapida {
            font-size: 0.95rem;
            padding: 8px 16px;
            background-color: #ffffff;
            border: 2px solid #000000;
            box-shadow: 0 3px 0 #000000;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div id="inicio" class="screen active">
            <h1>DERIVADA DIRECTA</h1>
            <button id="btn-comenzar">Calcular ya</button>
        </div>

        <div id="calculadora" class="screen">
            <h2 style="font-size: 1.5rem; text-transform: uppercase; margin-bottom: 20px;">Formulario de Derivadas</h2>
            
            <div style="margin-bottom: 20px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; align-items: center;">
                <div>
                    <label style="font-weight: bold;">Tipo: </label>
                    <select id="tipo-derivada">
                        <option value="potencia">axⁿ (Potencia)</option>
                        <option value="seno">a · sin(kx) (Seno)</option>
                        <option value="coseno">a · cos(kx) (Coseno)</option>
                        <option value="logaritmo">a · ln(kx) (Logaritmo)</option>
                    </select>
                </div>
                <div>
                    <label style="font-weight: bold;">Estructura: </label>
                    <select id="tipo-estructura">
                        <option value="sencilla">Operación Libre (Lineal)</option>
                        <option value="division">División (Fracción)</option>
                    </select>
                </div>
            </div>

            <div style="margin-bottom: 20px;">
                <button id="btn-vista-lineal" class="btn-vista-rapida" type="button">Ir a Operación Libre</button>
                <button id="btn-vista-division" class="btn-vista-rapida" type="button" style="background-color: #3498db; color: white;">Ir a División (Fracción)</button>
            </div>

            <div class="opcion-bloque" id="area-ecuacion">
                </div>

            <button id="btn-calcular">Calcular Derivada</button>
            <button id="btn-volver" style="background-color: #009933;">Volver al Inicio</button>

            <div id="resultado-box">
                <h3>Procedimiento paso a paso:</h3>
                <div id="pasos-derivada"></div>
            </div>
        </div>

    </div>

    <script>
        const pantallaInicio = document.getElementById('inicio');
        const pantallaCalculadora = document.getElementById('calculadora');
        const btnComenzar = document.getElementById('btn-comenzar');
        const btnVolver = document.getElementById('btn-volver');
        const btnCalcular = document.getElementById('btn-calcular');
        const tipoDerivada = document.getElementById('tipo-derivada');
        const tipoEstructura = document.getElementById('tipo-estructura');
        const areaEcuacion = document.getElementById('area-ecuacion');
        const resultadoBox = document.getElementById('resultado-box');
        const pasosDiv = document.getElementById('pasos-derivada');

        // Botones rápidos de estructura sugeridos por el usuario
        const btnVistaLineal = document.getElementById('btn-vista-lineal');
        const btnVistaDivision = document.getElementById('btn-vista-division');

        // Memorias de entrada
        let memoriaLineal = "4x3";
        let memoriaNum = "1";
        let memoriaDen = "4x3";

        function actualizarInterfazGrafica() {
            const tipoEst = tipoEstructura.value;
            const tipoDer = tipoDerivada.value;
            
            if (document.getElementById('val-lineal')) memoriaLineal = document.getElementById('val-lineal').value;
            if (document.getElementById('val-u')) memoriaNum = document.getElementById('val-u').value;
            if (document.getElementById('val-dv')) memoriaDen = document.getElementById('val-dv').value;

            // Definir placeholders de ayuda según la función seleccionada
            let placeholderEj = "Ej: 4x3";
            if (tipoDer === 'seno') placeholderEj = "Ej: 2sin(5x)";
            if (tipoDer === 'coseno') placeholderEj = "Ej: 2cos(5x)";
            if (tipoDer === 'logaritmo') placeholderEj = "Ej: 3ln(4x)";

            if (tipoEst === 'sencilla') {
                areaEcuacion.innerHTML = `
                    <span class="texto-matematico">f(x) = </span>
                    <input type="text" id="val-lineal" class="input-unico-largo" value="${memoriaLineal}" placeholder="${placeholderEj}">
                `;
            } else {
                areaEcuacion.innerHTML = `
                    <span class="texto-matematico">f(x) = </span>
                    <div class="contenedor-fraccion">
                        <div class="fila-numerador">
                            <input type="text" id="val-u" class="input-fraccion-libre" value="${memoriaNum}" placeholder="Numerador">
                        </div>
                        <div class="linea-fraccion"></div>
                        <div class="fila-denominador">
                            <input type="text" id="val-dv" class="input-fraccion-libre" value="${memoriaDen}" placeholder="Denominador">
                        </div>
                    </div>
                `;
            }
            activarFiltroSeguridad();
        }

        function activarFiltroSeguridad() {
            const inputs = [document.getElementById('val-lineal'), document.getElementById('val-u'), document.getElementById('val-dv')];
            inputs.forEach(input => {
                if (input) {
                    input.addEventListener('input', (e) => {
                        e.target.value = e.target.value.replace(/[^0-9a-zA-Z\^\+\-\(\)]/g, '');
                    });
                }
            });
        }

        // Manejadores de los botones de cambio rápido de estructura
        btnVistaLineal.addEventListener('click', () => {
            tipoEstructura.value = 'sencilla';
            actualizarInterfazGrafica();
            resultadoBox.style.display = 'none';
        });

        btnVistaDivision.addEventListener('click', () => {
            tipoEstructura.value = 'division';
            actualizarInterfazGrafica();
            resultadoBox.style.display = 'none';
        });

        // Detectar cambios en los selectores
        tipoDerivada.addEventListener('change', () => {
            const t = tipoDerivada.value;
            if (t === 'potencia') { memoriaLineal = "4x3"; memoriaDen = "4x3"; }
            else if (t === 'seno') { memoriaLineal = "2sin(5x)"; memoriaDen = "sin(5x)"; }
            else if (t === 'coseno') { memoriaLineal = "2cos(5x)"; memoriaDen = "cos(5x)"; }
            else if (t === 'logaritmo') { memoriaLineal = "3ln(4x)"; memoriaDen = "ln(4x)"; }
            
            actualizarInterfazGrafica();
            resultadoBox.style.display = 'none';
        });

        tipoEstructura.addEventListener('change', () => {
            actualizarInterfazGrafica();
            resultadoBox.style.display = 'none';
        });

        btnComenzar.addEventListener('click', () => {
            pantallaInicio.classList.remove('active');
            pantallaCalculadora.classList.add('active');
            actualizarInterfazGrafica();
        });

        btnVolver.addEventListener('click', () => {
            pantallaCalculadora.classList.remove('active');
            pantallaInicio.classList.add('active');
            resultadoBox.style.display = 'none';
        });

        // PARSEADOR ALGEBRAICO EXTRACTOR
        function extraerParametros(texto, tipo) {
            let limpio = texto.toLowerCase().replace(/\s+/g, '').replace(/[\(\)]/g, '');
            let a = 1, k = 1, n = 1;

            if (tipo === 'potencia') {
                if (!limpio.includes('x')) return { a: parseFloat(limpio) || 1, n: 0 };
                let partes = limpio.split('x');
                if (partes[0] === "") a = 1;
                else if (partes[0] === "-") a = -1;
                else a = parseFloat(partes[0]) || 1;
                
                let expPart = partes[1] ? partes[1].replace('^', '') : "";
                n = expPart === "" ? 1 : parseFloat(expPart);
                return { a, n };
            } else {
                let tag = tipo === 'seno' ? 'sin' : (tipo === 'coseno' ? 'cos' : 'ln');
                if (!limpio.includes(tag)) limpio = tag + limpio;

                let partes = limpio.split(tag);
                if (partes[0] === "") a = 1;
                else if (partes[0] === "-") a = -1;
                else a = parseFloat(partes[0]) || 1;

                let arg = partes[1] ? partes[1].replace('x', '') : "";
                k = arg === "" ? 1 : parseFloat(arg);
                return { a, k };
            }
        }

        // MOTOR DE CÁLCULO DE DERIVADAS
        btnCalcular.addEventListener('click', () => {
            const est = tipoEstructura.value;
            const opc = tipoDerivada.value;
            let htmlPasos = "";
            let resultadoFinal = "";

            let datos = null;
            let esFraccion = (est === 'division');

            if (!esFraccion) {
                let txt = document.getElementById('val-lineal').value.trim();
                if (!txt) { alert("Ingresa una expresión."); return; }
                datos = extraerParametros(txt, opc);
            } else {
                let num = document.getElementById('val-u').value.trim();
                let den = document.getElementById('val-dv').value.trim();
                if (!num || !den) { alert("Completa ambos términos de la fracción."); return; }
                
                let factorNum = parseFloat(num) || 1;
                datos = extraerParametros(den, opc);
                
                if (opc === 'potencia') {
                    datos.n = -datos.n;
                    datos.a = factorNum / datos.a;
                    htmlPasos += `<div class="paso" style="color: #0022aa; font-weight: bold;">➔ Simplificación de Fracción:<br> Subimos la potencia al numerador cambiando el signo de su exponente: f(x) = ${datos.a}x<sup>${datos.n}</sup></div>`;
                } else {
                    htmlPasos += `<div class="paso" style="color: #0022aa; font-weight: bold;">➔ Nota de Estructura Fraccionaria:<br> Al estar la función en el denominador, se resuelve mediante regla de la cadena exponencial (u⁻¹). A nivel bachillerato lineal directo, se recomienda analizar la función de forma directa.</div>`;
                }
            }

            // EJECUCIÓN DE ALGORITMOS POR FÓRMULA
            if (opc === 'potencia') {
                let coef = datos.a * datos.n;
                let nuevoExp = datos.n - 1;
                htmlPasos += `
                    <div class="paso"><b>Fórmula Base:</b> d/dx [a·xⁿ] = a · n · xⁿ⁻¹</div>
                    <div class="paso"><b>Paso 1:</b> Multiplicar el coeficiente externo por el exponente actual &rarr; ${datos.a} × ${datos.n} = ${coef}</div>
                    <div class="paso"><b>Paso 2:</b> Restar una unidad al exponente &rarr; ${datos.n} - 1 = ${nuevoExp}</div>
                `;
                resultadoFinal = `${coef}x<sup>${nuevoExp}</sup>`;

            } else if (opc === 'seno') {
                let coef = datos.a * datos.k;
                htmlPasos += `
                    <div class="paso"><b>Fórmula con Argumento:</b> d/dx [a · sin(kx)] = a · k · cos(kx)</div>
                    <div class="paso"><b>Paso 1 (Derivada Interna):</b> La derivada del argumento (<b>${datos.k}x</b>) es <b>${datos.k}</b>.</div>
                    <div class="paso"><b>Paso 2:</b> Multiplicar el coeficiente exterior por el resultado interno &rarr; ${datos.a} × ${datos.k} = ${coef}</div>
                    <div class="paso"><b>Paso 3:</b> Intercambiar la función Seno por Coseno manteniendo el argumento intacto.</div>
                `;
                resultadoFinal = `${coef}·cos(${datos.k}x)`;

            } else if (opc === 'coseno') {
                let coef = -(datos.a * datos.k);
                htmlPasos += `
                    <div class="paso"><b>Fórmula con Argumento:</b> d/dx [a · cos(kx)] = -a · k · sin(kx)</div>
                    <div class="paso"><b>Paso 1 (Derivada Interna):</b> La derivada de <b>${datos.k}x</b> es <b>${datos.k}</b>.</div>
                    <div class="paso"><b>Paso 2 (Ajuste de Signo):</b> Ya que la derivada del coseno es el <i>-sin</i>, el coeficiente final cambia su signo &rarr; -(${datos.a} × ${datos.k}) = ${coef}</div>
                `;
                resultadoFinal = `${coef}·sin(${datos.k}x)`;

            } else if (opc === 'logaritmo') {
                htmlPasos += `
                    <div class="paso"><b>Fórmula del Logaritmo:</b> d/dx [a · ln(kx)] = a · (k / kx) = a / x</div>
                    <div class="paso"><b>Paso 1 (Simplificación algebraica de examen):</b> Al aplicar la regla de la cadena, los términos numéricos internos arriba y abajo se cancelan uniformemente (${datos.k}/${datos.k} = 1). ¡Por lo tanto, la constante interna no afecta la derivada final!</div>
                `;
                resultadoFinal = `${datos.a}/x`;
            }

            if (esFraccion && opc !== 'potencia') {
                resultadoFinal = `[ ${resultadoFinal} ] / (${document.getElementById('val-dv').value})²`;
                htmlPasos += `<div class="paso"><b>Nota:</b> Se aplicó la estructura divisoria complementaria sobre el denominador al cuadrado.</div>`;
            }

            htmlPasos += `
                <div class="paso" style="font-size: 1.3rem; margin-top: 15px; border-top: 2px dashed #000000; padding-top: 10px;">
                    <b>Resultado Estructurado f'(x) = </b> <span style="color: #00cc44; font-weight: bold;">${resultadoFinal}</span>
                </div>
            `;

            pasosDiv.innerHTML = htmlPasos;
            resultadoBox.style.display = 'block';
        });
    </script>
</body>
</html>
